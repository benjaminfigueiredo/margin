<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Margin — papers</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- The paper UI's stylesheet holds the colour tokens and the dark theme; hub.css only lays out this page. -->
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/hub.css">
  <!-- A forced light/dark theme before first paint, as in web/index.html (see web/src/hub.js). -->
  <script>try { var t = localStorage.getItem('margin:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body class="hub">
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="/favicon.svg" alt="" aria-hidden="true">
      <span class="project">Margin</span>
      <span class="sep">/</span>
      <span class="hub-sub">Papers</span>
    </div>
    <div class="top-actions">
      <button id="btn-add" class="btn top" title="Add a paper folder to the list">Open folder…</button>
    </div>
  </header>

  <main id="hub-main" class="hub-main">
    <form id="add-form" class="hub-add hidden" autocomplete="off">
      <label for="add-path">Paper folder</label>
      <div class="row">
        <input id="add-path" class="hub-input" type="text" spellcheck="false" placeholder="/Users/you/papers/my-paper  or  ~/papers/my-paper">
        <button type="submit" class="btn primary">Add</button>
        <button type="button" class="btn ghost" id="add-cancel">Cancel</button>
      </div>
      <p class="fine">The folder that holds the paper's main .tex file (usually your git clone of the Overleaf project).</p>
      <p id="add-error" class="hub-error hidden" role="alert"></p>
    </form>
    <p id="hub-warning" class="hub-note hidden" role="status"></p>
    <section id="papers" class="papers" aria-label="Your papers"></section>
    <div id="empty" class="hub-empty hidden">
      <p><strong>No papers yet.</strong></p>
      <p>Press <em>Open folder…</em> and choose the folder that holds a paper. Margin remembers it here, gives it its own port, and keeps Claude Code in that folder connected to it.</p>
    </div>
  </main>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/hub.js"></script>
</body>
</html>
