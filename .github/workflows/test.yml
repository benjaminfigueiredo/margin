name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install TeX (latexmk, bibtex, synctex)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-recommended texlive-latex-extra texlive-bibtex-extra
      - run: npm ci
      - name: Built UI is up to date
        run: |
          npm run build
          git diff --exit-code -- public/ || (echo "public/ is stale: run 'npm run build' and commit it" && exit 1)
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm test
